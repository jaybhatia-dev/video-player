<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Video Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Native HTML5 Video Player (Autoplay removed, sound enabled by default) -->
    <video id="my-player" controls playsinline></video>

    <script>
        // 1. Grab the URL query string (e.g., ?url=https://...)
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('url');

        // 2. Feed the URL into the video source if it exists
        if (videoUrl) {
            const player = document.getElementById('my-player');
            player.src = decodeURIComponent(videoUrl);
        } else {
            document.body.innerHTML = "<h2 style='color:white; text-align:center; margin-top:20%; font-family:sans-serif;'>No video URL provided. Append ?url=YOUR_VIDEO_URL to the link.</h2>";
        }
    </script>

</body>
</html>
